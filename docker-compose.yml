version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: tyreiq_postgres
    restart: always
    environment:
      POSTGRES_USER: tyreiq_user
      POSTGRES_PASSWORD: tyreiq_password
      POSTGRES_DB: tyreiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tyreiq_user -d tyreiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Mosquitto MQTT Broker Service
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: tyreiq_mqtt
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. FastAPI Python Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tyreiq_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://tyreiq_user:tyreiq_password@postgres:5432/tyreiq_db
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
      - DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tyreiq_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
